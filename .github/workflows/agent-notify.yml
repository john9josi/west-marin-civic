name: Agent Notify

on:
  issue_comment:
    types: [created]

jobs:
  notify:
    if: github.event.issue.number == 60
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD"
        env:
          PAYLOAD: ${{ toJSON(format('{{"text":"{0}","username":"{1}","icon_emoji":":robot_face:"}}', github.event.comment.body, github.event.comment.user.login)) }}
